<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecVerse 3D — Dorm Room & Wrist Watch</title>
  <script src="https://cloudflare.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Trebuchet MS", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { overflow: hidden; background: #f27420; color: white; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .hidden { display: none !important; }

    /* ================= 1. ORANGE TILED LOGIN SCREEN ================= */
    .orange-screen {
      position: fixed; inset: 0; z-index: 40;
      background-color: #f47a24;
      background-image: url("data:image/svg+xml,%3Csvg width='90' height='90' viewBox='0 0 90 90' xmlns='http://w3.org transform='rotate(-22 45 45)' fill='none' stroke='%23ffffff' stroke-opacity='0.16' stroke-width='4'%3E%3Crect x='22' y='20' width='46' height='50' rx='10'/%3E%3Cline x1='22' y1='34' x2='68' y2='34'/%3E%3Cpath d='M33 48 Q45 58 57 48' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E");
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }

    .login-container {
      max-width: 960px; width: 100%;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-around; gap: 30px;
    }

    /* Left Black Avatar Silhouette */
    .silhouette-wrap {
      position: relative; display: flex; flex-direction: column; align-items: center;
      filter: drop-shadow(12px 14px 0px rgba(0, 0, 0, 0.25));
      transform: scale(1.05);
    }
    .sil-spike {
      width: 0; height: 0;
      border-left: 16px solid transparent; border-right: 22px solid transparent;
      border-bottom: 36px solid #0c0c0e;
      margin-bottom: -14px; margin-right: 16px; transform: rotate(-18deg);
    }
    .sil-head {
      width: 118px; height: 132px; background: #0c0c0e;
      border-radius: 52% 52% 46% 46%; margin-bottom: 16px;
    }
    .sil-upper {
      display: flex; align-items: flex-end; gap: 18px;
    }
    .sil-torso {
      width: 158px; height: 215px; background: #0c0c0e;
      border-radius: 42px 42px 16px 16px;
    }
    .sil-hand-left {
      width: 28px; height: 64px; background: #0c0c0e;
      border-radius: 10px; margin-bottom: 4px;
    }
    .sil-hand-right {
      width: 32px; height: 76px; background: #0c0c0e;
      border-radius: 10px; margin-bottom: 14px; transform: rotate(6deg);
    }

    /* Right White Card + Overlapping Stacked Logo */
    .card-column {
      display: flex; flex-direction: column; align-items: center;
      width: 100%; max-width: 430px;
    }

    .stacked-logo {
      display: flex; align-items: flex-start; gap: 6px;
      background: #ffffff; padding: 10px 18px 12px; border-radius: 20px;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.22);
      margin-bottom: -26px; z-index: 5;
    }
    .logo-words {
      display: flex; flex-direction: column; font-weight: 900;
      font-size: 40px; line-height: 0.88; color: #f47a24; letter-spacing: -1.5px;
    }
    .logo-tv {
      width: 56px; height: 62px; background: #f47a24; border-radius: 12px;
      padding: 5px; display: flex; flex-direction: column; justify-content: space-between;
      margin-top: -12px; border: 4px solid #ffffff;
      box-shadow: 0 4px 0 rgba(0,0,0,0.18);
    }
    .tv-top-bar { height: 7px; background: #ffffff; border-radius: 3px; }
    .tv-face {
      flex: 1; background: #ffffff; border-radius: 6px; margin-top: 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .tv-smile {
      width: 26px; height: 12px; border-bottom: 4px solid #f47a24; border-radius: 0 0 20px 20px;
      margin-top: 4px;
    }

    .white-login-card {
      background: #fcf7f2; width: 100%; border-radius: 16px;
      padding: 52px 34px 26px;
      box-shadow: 0 12px 0 rgba(0, 0, 0, 0.25);
      display: flex; flex-direction: column; align-items: center;
    }

    .active-user-pill {
      font-size: 13px; font-weight: 800; color: #78716c; margin-bottom: 14px;
      background: #f3ece4; padding: 5px 14px; border-radius: 999px;
    }

    .btn-rec-play {
      width: 100%;
      background: linear-gradient(90deg, #ff7e29 0%, #ea4c08 100%);
      color: #ffffff; border: none; padding: 16px; border-radius: 10px;
      font-size: 18px; font-weight: 900; letter-spacing: 0.8px; cursor: pointer;
      box-shadow: 0 4px 0 #b83700; transition: 0.12s; margin-bottom: 14px;
    }
    .btn-rec-play:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .btn-rec-play:active { transform: translateY(2px); box-shadow: 0 1px 0 #b83700; }

    .btn-rec-switch {
      width: 100%;
      background: #fdf2ea; color: #d9531e;
      border: 2px solid #e89b74; padding: 12px; border-radius: 10px;
      font-size: 14px; font-weight: 900; letter-spacing: 0.5px; cursor: pointer;
      transition: 0.12s; margin-bottom: 18px;
    }
    .btn-rec-switch:hover { background: #fae3d4; }

    .lang-row {
      display: flex; align-items: center; gap: 8px; color: #44403c;
      font-size: 14px; font-weight: 700; cursor: pointer; padding: 4px 10px; border-radius: 8px;
    }
    .lang-row:hover { background: #f3ece4; }
    .lang-icon {
      border: 1.5px solid #44403c; border-radius: 4px; padding: 1px 5px; font-size: 11px; font-weight: 900;
    }

    /* Switch Account Panel */
    .switch-panel {
      width: 100%; background: #fff; border: 2px solid #e89b74; border-radius: 12px;
      padding: 14px; margin-bottom: 14px; text-align: center;
    }
    .switch-input {
      width: 100%; padding: 10px; border: 2px solid #cbd5e1; border-radius: 8px;
      font-size: 15px; font-weight: 800; color: #1e293b; text-align: center; margin-bottom: 10px; outline: none;
    }
    .switch-input:focus { border-color: #f47a24; }
    .mini-swatches { display: flex; justify-content: center; gap: 8px; margin-bottom: 6px; }
    .mini-swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #cbd5e1; cursor: pointer; }

    /* Loading Progress Bar Screen */
    .loading-box { text-align: center; width: 100%; max-width: 460px; }
    .prog-track {
      width: 100%; height: 16px; background: rgba(0, 0, 0, 0.25);
      border-radius: 999px; padding: 3px; margin: 28px 0 12px;
      border: 2px solid rgba(255, 255, 255, 0.65);
    }
    .prog-fill {
      height: 100%; width: 0%; background: #ffffff; border-radius: 999px; transition: width 0.25s;
    }

    /* ================= 2. IN-GAME HUD ================= */
    .hud-top {
      position: fixed; top: 16px; left: 16px; right: 16px; z-index: 10;
      display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none;
    }
    .pill-box {
      background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px;
      padding: 10px 16px; pointer-events: auto;
    }
    .key { background: #1e293b; border: 1px solid #475569; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 800; color: #38bdf8; }

    .hud-bottom {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 999px;
      padding: 8px 14px; display: flex; gap: 10px; align-items: center;
    }
    .hud-btn {
      background: #1e293b; color: white; border: 1px solid #334155;
      padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: 0.15s;
    }
    .hud-btn:hover { background: #334155; }
    .hud-btn.watch { background: #0284c7; border-color: #38bdf8; }
    .hud-btn.orange { background: #f97316; border-color: #fb923c; }

    /* ================= 3. WRIST WATCH UI ================= */
    .watch-overlay {
      position: fixed; inset: 0; z-index: 30;
      background: rgba(9, 13, 22, 0.65); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .watch-overlay.open { display: flex; }
    .watch-frame {
      background: #fcf7f2; color: #1e293b;
      border: 5px solid #e7d5be; border-radius: 26px;
      width: 100%; max-width: 500px; padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    .watch-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #e7d5be; padding-bottom: 12px; margin-bottom: 16px;
    }
    .watch-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .w-tab {
      background: #f3ece4; border: 2px solid #e7d5be; color: #57534e;
      padding: 10px; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer;
    }
    .w-tab.active { background: #f47a24; color: white; border-color: #ea580c; }
    .room-card {
      background: #ffffff; border: 2px solid #e7d5be; border-radius: 14px;
      padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
    }
    #toast {
      position: fixed; top: 75px; left: 50%; transform: translateX(-50%);
      background: #f97316; color: white; padding: 8px 18px; border-radius: 999px;
      font-size: 13px; font-weight: 800; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 50;
    }
  </style>
</head>
<body>

  <!-- 1. ORANGE PATTERNED LOGIN SCREEN -->
  <div id="loginScreen" class="orange-screen">
    <div class="login-container">
      <!-- Left Silhouette -->
      <div class="silhouette-wrap">
        <div class="sil-spike"></div>
        <div class="sil-head"></div>
        <div class="sil-upper">
          <div class="sil-hand-left"></div>
